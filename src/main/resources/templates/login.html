<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - CineTicket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <div class="container mb-5" style="max-width: 420px;">
        <h2 class="mt-4 mb-3">Đăng nhập</h2>
        <div th:if="${param.error}" class="alert alert-danger">Email hoặc mật khẩu không chính xác!</div>
        <div th:if="${param.logout}" class="alert alert-info">Đã đăng xuất thành công!</div>
        <div th:if="${param.success}" class="alert alert-success">Đăng ký thành công, hãy đăng nhập!</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label>Email:</label>
                <input type="text" name="username" class="form-control" required />
            </div>
            <div class="mb-3">
                <label>Mật khẩu:</label>
                <input type="password" name="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-success w-100">Đăng nhập</button>
        </form>
        <p class="mt-3">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký tại đây</a></p>
    </div>
</body>
</html>
