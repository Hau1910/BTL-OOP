<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trang chủ - CineTicket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar dùng chung (nút Đăng nhập/Đăng ký ở góc trên phải) -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <!-- Banner -->
    <div class="hero text-white text-center p-5 mb-5">
        <h1 class="display-5 fw-bold">Đặt vé xem phim dễ dàng</h1>
        <p class="lead">Chọn phim, chọn lịch chiếu, chọn ghế trong vài phút.</p>
        <a th:href="@{/movies}" class="btn btn-success btn-lg mt-2">Xem phim đang chiếu</a>
    </div>

    <!-- Phim đang chiếu (sau này Người 2 sẽ đổ danh sách phim thật vào đây) -->
    <section class="container mb-5">
        <h2 class="mb-4">Phim đang chiếu</h2>
        <div class="row">
            <!-- Sửa thành th:each="movie : ${movies}" khi có dữ liệu -->
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Tên phim mẫu</h5>
                        <p class="card-text text-muted">Thể loại: Hành động • 120 phút</p>
                        <a th:href="@{/movies/1}" class="btn btn-outline-success btn-sm">Xem chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        © 2026 CineTicket - Đồ án OOP
    </footer>
</body>
</html>
