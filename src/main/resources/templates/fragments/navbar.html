<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Fragment navbar dùng chung cho mọi trang.
  Cách dùng: <th:block th:replace="fragments/navbar :: navbar"></th:block>
  Chưa đăng nhập  -> hiện nút Đăng nhập / Đăng ký (góc trên phải)
  Đã đăng nhập    -> hiện "Xin chào, [email]" + nút Đăng xuất
  ${isLoggedIn}/${loginName} được CurrentUserAdvice đưa vào model tự động.
-->
<th:block th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">🎬 CineTicket</a>

            <!-- Đã đăng nhập: tên + nút Đăng xuất -->
            <div class="ms-auto d-flex align-items-center gap-2" th:if="${isLoggedIn}">
                <span class="navbar-text text-white me-2">
                    Xin chào, <b th:text="${loginName}">user</b>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
                </form>
            </div>

            <!-- Chưa đăng nhập: nút Đăng nhập / Đăng ký -->
            <div class="ms-auto d-flex align-items-center gap-2" th:unless="${isLoggedIn}">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a class="btn btn-success btn-sm" th:href="@{/register}">Đăng ký</a>
            </div>
        </div>
    </nav>
</th:block>
</html>
