<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký - CineTicket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <div class="container mb-5" style="max-width: 420px;">
        <h2 class="mt-4 mb-3">Đăng ký tài khoản</h2>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Lỗi</div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">
            <div class="mb-3">
                <label>Họ tên:</label>
                <input type="text" th:field="*{fullName}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label>Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label>Số điện thoại:</label>
                <input type="text" th:field="*{phone}" class="form-control" />
            </div>
            <div class="mb-3">
                <label>Mật khẩu:</label>
                <input type="password" th:field="*{password}" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-success w-100">Đăng ký</button>
        </form>
        <p class="mt-3">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a></p>
    </div>
</body>
</html>
