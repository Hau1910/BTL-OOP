<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Đăng nhập</h2>
    <div th:if="${param.error}" class="alert alert-danger">Email hoặc mật khẩu không chính xác!</div>
    <div th:if="${param.logout}" class="alert alert-info">Đã đăng xuất thành công!</div>
    <div th:if="${param.success}" class="alert alert-success">Đăng ký thành công, hãy đăng nhập!</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label>Email:</label>
            <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Mật khẩu:</label>
            <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success">Đăng nhập</button>
    </form>
    <p class="mt-3">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký tại đây</a></p>
</body>
</html>
