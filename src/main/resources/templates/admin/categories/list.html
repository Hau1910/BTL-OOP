<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/catalog :: head('Quản lý thể loại')}"></head>
<body>
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>
<main class="container page-section">
    <a th:href="@{/admin/movies}" class="text-success d-inline-block mb-4">← Quản lý phim</a>
    <p class="eyebrow text-success">QUẢN TRỊ NỘI DUNG</p><h1 class="fw-bold mb-4">Quản lý thể loại</h1>
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div class="row g-4">
        <div class="col-md-5"><form th:action="${categoryId == null} ? @{/admin/categories} : @{/admin/categories/{id}(id=${categoryId})}" th:object="${categoryForm}" method="post" class="panel p-4">
            <h2 class="h5 mb-3" th:text="${categoryId == null ? 'Thêm thể loại' : 'Đổi tên thể loại'}"></h2>
            <label for="name" class="form-label">Tên thể loại</label>
            <input th:field="*{name}" required maxlength="80" class="form-control" th:errorclass="is-invalid" placeholder="Ví dụ: Hành động">
            <div class="invalid-feedback" th:errors="*{name}"></div>
            <div class="d-flex gap-2 mt-3"><button class="btn btn-success" type="submit">Lưu thể loại</button><a th:if="${categoryId != null}" th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a></div>
        </form></div>
        <div class="col-md-7"><div class="table-responsive panel"><table class="table align-middle mb-0 admin-table">
            <thead><tr><th scope="col">Thể loại</th><th scope="col" class="text-end">Thao tác</th></tr></thead>
            <tbody><tr th:if="${#lists.isEmpty(categories)}"><td colspan="2" class="p-4 text-secondary text-center">Chưa có thể loại. Hãy thêm thể loại đầu tiên.</td></tr>
            <tr th:each="category : ${categories}"><td th:text="${category.name}"></td><td class="text-end"><a th:href="@{/admin/categories/{id}/edit(id=${category.id})}" class="btn btn-outline-success btn-sm">Đổi tên</a></td></tr></tbody>
        </table></div><p class="small text-secondary mt-3">Đổi tên sẽ cập nhật thể loại trên tất cả phim đang sử dụng.</p></div>
    </div>
</main>
<th:block th:replace="~{fragments/catalog :: footer}"></th:block>
</body></html>
